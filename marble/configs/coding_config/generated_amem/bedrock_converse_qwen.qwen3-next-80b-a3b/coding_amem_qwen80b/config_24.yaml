task:
  content: |-
    Software Development Task:

    Please write a finance management system called BudgetBuddy that integrates savings tracking, expense analysis, and expense consolidation into a single platform. BudgetBuddy is a comprehensive financial management tool that allows users to track their savings, analyze their expenses, and consolidate financial data from multiple sources, providing a holistic view of their financial health and offering personalized financial advice.
    1. Implementation requirements:
       - Frontend: Develop a user-friendly interface that allows users to input and manage their financial data, visualize their savings and expenses through interactive charts and graphs, and receive personalized financial advice. The frontend should be responsive and accessible on both desktop and mobile devices.
       - Backend: Implement a robust backend system that securely handles user data, including saving, retrieving, and processing financial information from various sources. The backend should support real-time data synchronization and provide APIs for data exchange with third-party financial services.
       - Database: Design a scalable and secure database schema to store user profiles, financial transactions, savings goals, and expense categories. Ensure the database supports efficient querying and data retrieval to facilitate real-time updates and reporting.
       - Multi-Agent Collaboration: The system should support collaboration between frontend and backend developers to ensure seamless integration of user interface components and backend services. Additionally, the system should facilitate collaboration between data analysts and financial advisors to provide users with accurate and actionable financial advice based on their data.


    2. Project structure:
       - solution.py (main implementation)

    3. Development process:
       - Developer: Create the code.
       - Developer: Revise the code.
       - Developer: Optimize the code.

    If there are multiple files, please put them all in solution.py, but remember to add the file name in the following format:
    ```python
    # file_name_1.py
    # your code here

    # file_name_2.py
    # your code here

    # file_name_3.py
    # your code here
    ```

    Please work together to complete this task following software engineering best practices.

  output_format: |
    The final deliverable should include:
    solution.py

agents:
  - type: CodingAgent
    agent_id: agent1
    profile: |
      I am a Senior Software Developer specialized in Python development.
      I am good at creating the code framework from scratch based on the task description and requirements.
      So I **have to** call "create_code" action to create the code in the first iteration at first.
      I am **very terrible** at do further modifications since I am not so creative or careful so I **have to** let agent 2 or agent 3 revise the code after I create the code and I **can't** call "give_advice_and_revise_code" action.
      Agent 2 is better at adding missing functions so it's better to let agent 2 revise the code at first.
      Agent 3 is better at fixing existing issues and optimizing the code so it's better to let agent 3 revise the code after agent 2 has revised the code so that the code is more optimized.


  - type: CodingAgent
    agent_id: agent2
    profile: |
      I am a Senior Software Developer specialized in Python development.
      I am better at adding missing functionality based on my decent understanding and compliance to the task description and requirements.
      I **have to** call "give_advice_and_revise_code" action to give advice to the code and revise the code.
      I **can't** call "create_code" action since I am not good at creating the code framework from scratch.
      I can let agent 3 to make the code more optimized after I have added the missing functionality.

  - type: CodingAgent
    agent_id: agent3
    profile: |
      I am a Senior Software Developer specialized in Python development.
      I am better at fixing existing issues and optimizing the code based on my innovation and creativity.
      I **have to** call "give_advice_and_revise_code" action to give advice to the code and revise the code.
      I **can't** call "create_code" action since I am not good at creating the code framework from scratch.
      I can let agent 2 to add the missing functionality after I have fixed the existing issues and optimized the code.

