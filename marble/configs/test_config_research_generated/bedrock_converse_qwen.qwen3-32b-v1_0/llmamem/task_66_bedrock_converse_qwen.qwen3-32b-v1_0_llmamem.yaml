task:
  content: "\n            Dear Research Team,\n\n            You are collaborating
    to generate a new research idea based on the following Introduction:\n\n     \
    \       **Introduction**\n\n             Introduction\nForecasting price movements
    in the \fnancial market is a di\x0Ecult task. Ac-\ncording to the E\x0Ecient-Market
    hypothesis (Kirkpatrick & Dahlquist, 2008),\nstock market prices follow a random
    walk process with unpredictable future\n\ructuations. When it comes to Bitcoin,
    its price \ructuates highly, which makes\nits forecasting challenging (Phaladisailoed
    & Numnonda, 2018). Technical and\nfundamental analysis are two typical tools used
    by traders to build their trading\nstrategies in the \fnancial markets. According
    to price movement and trading\nvolume, technical analysis provides trading signals
    (Murphy, 1999). Fundamen-\ntal analysis, unlike the former, examines related economic
    and \fnancial factors\nto determine a security's underlying worth (Drakopoulou,
    2016).\nHumans and computers both perform data analysis. Although humans are\n\
    able to keep an eye on \fnancial charts (such as prices) and make decisions based\n\
    on their past experiences, managing a vast volume of data is complicated due to\n\
    various factors in\ruencing the price movement. As a result, algorithmic trading\n\
    has emerged to tackle this issue. Algorithmic trading is a type of trading where\n\
    a computer that has been pre-programmed with a speci\fc set of mathematical\n\
    rules is employed (Th\x13 eate & Ernst, 2021). There are two sorts of approaches\n\
    in \fnancial markets: price prediction and algorithmic trading. Price prediction\n\
    aims to build a model that can precisely predict future prices, whereas algorith-\n\
    mic trading is not limited to the price prediction and attempts to participate\n\
    in the \fnancial market (e.g. choosing a position and the number of trading\n\
    shares) to maximize pro\ft (Hirchoua et al., 2021). It is claimed that a more\n\
    precise prediction does not necessarily result in a higher pro\ft. In other words,\n\
    a trader's overall loss due to incorrect actions may be greater than the gain
    due\nto correct ones (Li et al., 2019). Therefore, algorithmic trading has been
    the\nfocus of this study.\nClassical Machine Learning (ML) and Deep Learning (DL),
    which are power-\nful tools for recognizing patterns, have been employed in various
    research \felds.\nIn recent years, using the ML as an intelligent agent has risen
    in popularity over\n2the alternative of the traditional approaches in which a
    human being makes a\ndecision. For two reasons, the ML and DL have enhanced theperformance
    in\nalgorithmic trading. Firstly, they can extract complex patterns from data
    that\nare di\x0Ecult for humans to accomplish. Secondly, emotion does not a\v\
    ect their\nperformance, which is a disadvantage for humans (Chakole et al., 2021).
    How-\never, there are two compelling reasons why the ML and DL in a supervised\n\
    learning approach are unsuitable for algorithmic trading. Firstly, supervised\n\
    learning is improper for learning problems with long-term and delayed rewards\n\
    (Dang, 2019), such as trading in \fnancial markets, which is why Reinforcement\n\
    Learning (RL), a sub\feld of ML, is required to solve a decision-making prob-\n\
    lem (trading) in an uncertain environment (\fnancial market) using the Markov\n\
    Decision Process (MDP). Secondly, in supervised learning, labeling is a critical\n\
    issue a\vecting the performance of the \fnal model. To illustrate, classi\fcation\n\
    and regression approaches with de\fned labels may not be appropriate, leading\n\
    to the selection of RL, which does not require labels and instead uses a goal\n\
    (reward function) to determine its policy.\nRecent studies have usually employed
    discrete action space RL to address\nalgorithmic trading problems (Chakole et
    al., 2021; Jeong & Kim, 2019; Shi\net al., 2021; Th\x13 eate & Ernst, 2021), which
    compels\n\n            **Your Task**\n\n            1. **Literature Review**:
    Analyze the Introduction provided and conduct a brief literature review to understand
    the current state of research in this area.\n\n            2. **Brainstorming**:
    Collaboratively brainstorm potential research ideas that build upon or address
    gaps in the Introduction.\n\n            3. **Summarization**: Summarize your
    collective ideas.\n\n            4. **Formulate a New Research Idea**: Develop
    a new research proposal in the format of the '5q', defined below:\n\n        \
    \       **Here is a high-level summarized insight of a research field Machine
    Learning.**\n\n               **Here are the five core questions:**\n\n      \
    \         **[Question 1] - What is the problem?**\n\n               Formulate
    the specific research question you aim to address. Only output one question and
    do not include any more information.\n\n               **[Question 2] - Why is
    it interesting and important?**\n\n               Explain the broader implications
    of solving this problem for the research community.\n               Discuss how
    such a paper will affect future research.\n               Discuss how addressing
    this question could advance knowledge or lead to practical applications.\n\n \
    \              **[Question 3] - Why is it hard?**\n\n               Discuss the
    challenges and complexities involved in solving this problem.\n              \
    \ Explain why naive or straightforward approaches may fail.\n               Identify
    any technical, theoretical, or practical obstacles that need to be overcome. MAKE
    IT CLEAR.\n\n               **[Question 4] - Why hasn't it been solved before?**\n\
    \n               Identify gaps or limitations in previous research or existing
    solutions.\n               Discuss any barriers that have prevented this problem
    from being solved until now.\n               Explain how your approach differs
    from or improves upon prior work. MAKE IT CLEAR.\n\n               **[Question
    5] - What are the key components of my approach and results?**\n\n           \
    \    Outline your proposed methodology in detail, including the method, dataset,
    and metrics that you plan to use.\n               Describe the expected outcomes.
    MAKE IT CLEAR.\n\n            Please work together to produce the '5q' for your
    proposed research idea.\n\n            Good luck!\n            "
