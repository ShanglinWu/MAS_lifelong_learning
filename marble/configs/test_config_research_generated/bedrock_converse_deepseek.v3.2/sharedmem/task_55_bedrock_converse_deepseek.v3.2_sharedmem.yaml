    20, 16]. It has been successful in joint\nvisual representations learning from
    image data while pre-\nserving data privacy [28, 35, 22]. However, current prac-\n\
    tices in FL are commonly limited to supervised learning\ntasks that require high-quality
    and domain-speciﬁc labels to\nbe available alongside the data. This requirement
    limits the\ndeployment of FL in many real-world applications where\naccess to
    high-quality labels at the edge is restricted [15].\nSelf-Supervised Learning
    (SSL) has been combined with\n*Equal contribution, authors ordered alphabetically.FL,
    enabling it to expand its potential of learning feature\nrepresentations from
