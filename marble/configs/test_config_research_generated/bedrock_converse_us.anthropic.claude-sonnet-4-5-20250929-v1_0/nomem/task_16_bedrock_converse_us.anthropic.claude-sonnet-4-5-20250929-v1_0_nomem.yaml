    singing recording.\n3.1. Singing voice augmentation\nTo boost performance, we
    leverage RawBoost for vocal aug-\nmentation and beat matching for instrumental
    augmentation.\n3.1.1. Beat matching for instrumental.\nIn this part, we will introduce
