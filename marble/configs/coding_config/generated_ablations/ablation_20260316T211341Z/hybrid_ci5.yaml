coordinate_mode: graph

relationships:
  - [agent1, agent2, "collaborates with"]
  - [agent2, agent1, "collaborates with"]
  - [agent1, agent3, "collaborates with"]
  - [agent3, agent1, "collaborates with"]
  # - [agent1, agent3, "supervises"]
  # - [agent1, agent4, "supervises"]
  # - [agent2, agent3, "collaborates with"]
  - [agent2, agent3, "collaborates with"]
  - [agent3, agent2, "collaborates with"]
  # - [agent3, agent4, "collaborates with"]

llm: "bedrock/converse/deepseek.v3.2"

environment:
  type: Coding
  name: "Coding Environment"
  workspace_dir: "workspace_bedrock_converse_deepseek.v3.2/ablation_20260316T211341Z/hybrid_ci5"
  max_iterations: 3

task:
  content: |-
    Software Development Task:

    Please write a program called MusicMashupBattle that allows users to collaborate and compete in creating music mashups. MusicMashupBattle is a multiplayer entertainment application that enables users to mix and match different music tracks, apply various effects, and create unique mashups. Users can join public or private rooms, collaborate in real-time to create mashups, and compete to see who can produce the most popular mashup based on user votes.
    1. Implementation requirements:
       - Frontend: Develop a user-friendly interface that allows users to select music tracks, apply effects, and preview the mashup. The interface should support real-time collaboration, enabling multiple users to work on the same mashup simultaneously. Implement a chat feature for users to communicate within the room.
       - Backend: Create a server that manages user sessions, room creation, and real-time synchronization of mashup creation. Implement a voting system to allow users to rate mashups and a leaderboard to display the top mashups. Ensure the backend can handle multiple concurrent sessions and data synchronization.
       - Database: Design a database to store user profiles, mashup creations, and voting data. The database should support efficient querying for leaderboards and user history. Implement security measures to protect user data and prevent unauthorized access.
       - Cross-Domain Interaction: Ensure seamless communication between the frontend and backend, particularly for real-time data updates during mashup creation and voting. Implement websockets or similar technology to facilitate low-latency updates and smooth user experience.


    2. Project structure:
       - solution.py (main implementation)

    3. Development process:
       - Developer: Create the code.
       - Developer: Revise the code.
       - Developer: Optimize the code.

    If there are multiple files, please put them all in solution.py, but remember to add the file name in the following format:
    ```python
    # file_name_1.py
    # your code here

    # file_name_2.py
    # your code here

    # file_name_3.py
    # your code here
    ```

    Please work together to complete this task following software engineering best practices.

  output_format: |
    The final deliverable should include:
    solution.py

agents:
  - type: BaseAgent
    agent_id: agent1
    profile: |
      I am a Senior Software Developer specialized in Python development.
      I am good at creating the code framework from scratch based on the task description and requirements.
      So I **have to** call "create_solution" action to create the code in the first iteration at first.
      I am **very terrible** at do further modifications since I am not so creative or careful so I **have to** let agent 2 or agent 3 revise the code after I create the code and I **can't** call "give_advice_and_revise" action.
      Agent 2 is better at adding missing functions so it's better to let agent 2 revise the code at first.
      Agent 3 is better at fixing existing issues and optimizing the code so it's better to let agent 3 revise the code after agent 2 has revised the code so that the code is more optimized.


  - type: BaseAgent
    agent_id: agent2
    profile: |
      I am a Senior Software Developer specialized in Python development.
      I am better at adding missing functionality based on my decent understanding and compliance to the task description and requirements.
      I **have to** call "give_advice_and_revise" action to give advice to the code and revise the code.
      I **can't** call "create_solution" action since I am not good at creating the code framework from scratch.
      I can let agent 3 to make the code more optimized after I have added the missing functionality.

  - type: BaseAgent
    agent_id: agent3
    profile: |
      I am a Senior Software Developer specialized in Python development.
      I am better at fixing existing issues and optimizing the code based on my innovation and creativity.
      I **have to** call "give_advice_and_revise" action to give advice to the code and revise the code.
      I **can't** call "create_solution" action since I am not good at creating the code framework from scratch.
      I can let agent 2 to add the missing functionality after I have fixed the existing issues and optimized the code.

memory:
  type: LLMAMem
  topology: hybrid   # "local" or "shared" or "hybrid"
  persist_dir: 
    memory_store/bedrock_converse_deepseek.v3.2/ablation_20260316T211341Z/hybrid_ci5
  consolidation_interval: 5
  # SharedMemory, BaseMemory, NoMemory, LLMAMem

metrics:
  evaluate_llm: "bedrock/converse/us.anthropic.claude-sonnet-4-5-20250929-v1:0"
  # evaluate_llm: "gpt-4o-mini-2024-07-18"
  code_quality: true
  test_coverage: true
  collaboration_effectiveness: true

engine_planner:
  initial_progress: "Starting the software development project with team coordination."

output:
  format: jsonl
  file_path: "result/bedrock_converse_deepseek.v3.2/ablation_20260316T211341Z/hybrid_ci5/development_output.jsonl"
