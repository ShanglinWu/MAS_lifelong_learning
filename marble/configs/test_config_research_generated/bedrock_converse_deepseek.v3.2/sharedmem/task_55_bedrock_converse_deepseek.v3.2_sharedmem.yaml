    at the edge\n[50, 26, 21, 51]. In contrast to supervised FL [7, 10, 28],\nfederated
    self-supervised learning (F-SSL) does not require\nhigh-quality labeled data,
    although it may require another\nstage of centralized ﬁne-tuning or personalizing
    the model\nfor downstream tasks with limited labeled data. F-SSL\nenables the
    re-purposing of heterogeneous, unlabeled, and\nuncurated real-world image data
