coordinate_mode: graph

relationships:
  - [agent1, agent2, "collaborates with"]
  - [agent2, agent1, "collaborates with"]
  - [agent1, agent3, "collaborates with"]
  - [agent3, agent1, "collaborates with"]
  # - [agent1, agent3, "supervises"]
  # - [agent1, agent4, "supervises"]
  # - [agent2, agent3, "collaborates with"]
  - [agent2, agent3, "collaborates with"]
  - [agent3, agent2, "collaborates with"]
  # - [agent3, agent4, "collaborates with"]

llm: "bedrock/converse/qwen.qwen3-32b-v1:0"

environment:
  type: Coding
  name: "Coding Environment"
  workspace_dir: "workspace_bedrock_converse_qwen.qwen3-32b-v1_0/ablation_20260316T214413Z/local_ci10"
  max_iterations: 3

task:
  content: |-
    Software Development Task:

    Please write a program called Office_Task_Collaboration_Manager that facilitates collaborative task management among multiple agents in an office environment. Office_Task_Collaboration_Manager is a software application that enables teams to assign, track, and collaborate on tasks, ensuring efficient communication and task completion. The system supports real-time updates, task delegation, and status tracking, and includes features for generating reports and alerts.
    1. Implementation requirements:
       - The program should allow users to create and assign tasks to other users, with the ability to set deadlines, priorities, and detailed descriptions.
       - Users should be able to collaborate on tasks by adding comments, attaching files, and updating task statuses (e.g., Not Started, In Progress, Completed).
       - The system should provide real-time notifications for task assignments, updates, and deadlines to all relevant users.
       - The application should include a feature for generating reports on task progress, including completed tasks, pending tasks, and overdue tasks.
       - The system should support user authentication and role-based access control to ensure that only authorized users can view and modify tasks.
       - Comprehensive test cases must be provided to validate the functionality of the system, including edge cases such as handling simultaneous updates, invalid inputs, and system performance under high load.
       - Test scenarios should include: creating and assigning tasks, updating task statuses, adding comments and attachments, generating reports, and handling notifications.


    2. Project structure:
       - solution.py (main implementation)

    3. Development process:
       - Developer: Create the code.
       - Developer: Revise the code.
       - Developer: Optimize the code.

    If there are multiple files, please put them all in solution.py, but remember to add the file name in the following format:
    ```python
    # file_name_1.py
    # your code here

    # file_name_2.py
    # your code here

    # file_name_3.py
    # your code here
    ```

    Please work together to complete this task following software engineering best practices.

  output_format: |
    The final deliverable should include:
    solution.py

agents:
  - type: BaseAgent
    agent_id: agent1
    profile: |
      I am a Senior Software Developer specialized in Python development.
      I am good at creating the code framework from scratch based on the task description and requirements.
      So I **have to** call "create_solution" action to create the code in the first iteration at first.
      I am **very terrible** at do further modifications since I am not so creative or careful so I **have to** let agent 2 or agent 3 revise the code after I create the code and I **can't** call "give_advice_and_revise" action.
      Agent 2 is better at adding missing functions so it's better to let agent 2 revise the code at first.
      Agent 3 is better at fixing existing issues and optimizing the code so it's better to let agent 3 revise the code after agent 2 has revised the code so that the code is more optimized.


  - type: BaseAgent
    agent_id: agent2
    profile: |
      I am a Senior Software Developer specialized in Python development.
      I am better at adding missing functionality based on my decent understanding and compliance to the task description and requirements.
      I **have to** call "give_advice_and_revise" action to give advice to the code and revise the code.
      I **can't** call "create_solution" action since I am not good at creating the code framework from scratch.
      I can let agent 3 to make the code more optimized after I have added the missing functionality.

  - type: BaseAgent
    agent_id: agent3
    profile: |
      I am a Senior Software Developer specialized in Python development.
      I am better at fixing existing issues and optimizing the code based on my innovation and creativity.
      I **have to** call "give_advice_and_revise" action to give advice to the code and revise the code.
      I **can't** call "create_solution" action since I am not good at creating the code framework from scratch.
      I can let agent 2 to add the missing functionality after I have fixed the existing issues and optimized the code.

memory:
