    \       **Introduction**\n\n             INTRODUCTION\nIn nonlinear dynamics,
    the traditional solution to the inverse problem, i.e., to analyze\ntime series
    to probe into the inner \\gears\" of the system, is based on the paradigm of delay-\n\
    coordinate embedding [1, 2]. The research started about four decades ago when
    Takens [1]\nproved that the underlying dynamical system can be faithfully reconstructed
    from time series\nwith a one-to-one correspondence between the reconstructed and
    the true but unknown\ndynamical systems. From the reconstructed system, statistical
    quantities characterizing the\ndynamical invariant set of the original system
    can be assessed [3, 4]. For example, from\ntime series, the fractal dimensions
    of the underlying chaotic attractor can be estimated [5{\n12], as well as the
    Lyapunov exponents [13{19] and some unstable periodic orbits [20{25].\nThe continuity
    and di\verentiability of the original dynamical system can be tested [26{30].\n\
    Practical issues on determining the basic parameters of delay-coordinate embedding
    such\nas the proper time delay [11, 12, 31{36] and the embedding dimension [37]
    were addressed.\nThe Takens' paradigm was also extended to dynamical systems in
    the regime of transient\nchaos [38{43] and to systems with a time delay [44].\n\
    There were previous DISCUSSION\nThe principle of exploiting sparse optimization
    such as compressive sensing to \fnd the\nequations of nonlinear dynamical systems
    from data was \frst articulated [78] in 2011. The\nbasic idea is to expand the
    equations (the velocity \feld for a continuous time dynamical sys-\ntem or the
    map function for a discrete time system) of the underlying system into a power\n\
    series or a Fourier series of a \fnite number of terms and then to determine the
    vector of the\nexpansion coe\x0Ecients based on data through sparse optimization.
    The sparse optimization\nprinciple has been demonstrated to be e\vective for \f
    nding the governing equations of cer-\ntain types of nonlinear dynamical systems
    for inferring the detailed connection structures of\ncomplex dynamical networks
    such as oscillator networks and social networks hosting evolu-\ntionary game dynamics.
    In spite of the demonstrated success, limitation and open questions\nremain.\n\
    A key requirement is that the coe\x0Ecient vector to be determined must be sparse.
