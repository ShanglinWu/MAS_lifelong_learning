    \       **Introduction**\n\n             \n\n1 Introduction\n\nGeneral policies
    are policies that can be used to solve a collection of planning\nproblems\nreactively Srivastava
    et al. (2008); Hu and Giacomo (2011); Belle and\nLevesque (2016); Bonet and\n\
    Geffner (2018); Illanes and\nMcIlraith (2019); Jiménez et al. (2019).\nFor example,
    a general policy for solving all Blocksworld problems can place\nall blocks on
    the table, and then build up the target towers from the bottom up.\nYet while
    nearly perfect general policies have been learned for many classes of\nplanning\n\
    domains Toyer et al. (2020); Rivlin et al. (2020); Ståhlberg et al. (2022a),\n\
    one key expressive limitation results from the types of features used to\nclassify
    state transitions or actions. In combinatorial approaches, features are\nselected
    from a domain-independent pool, created using a description logic\ngrammar Baader
    et al. (2003) based on the given domain\npredicates Bonet and\nGeffner (2018);
    Bonet et al. (2019), while in deep\nlearning approaches, the features are learned
    using relational versions of graph\nneural networks\nScarselli et al. (2009);
    Gilmer et al. (2017); Hamilton (2020). A shared\nlimitation of both approaches,
    however, is their inability to learn\npolicies requiring complex logical features.
    This limitation arises in\ndescription logics from the C2subscript𝐶2C_{2}italic_C
    start_POSTSUBSCRIPT 2 end_POSTSUBSCRIPT fragment of first-order logic that they\n\
    capture; namely, first-order logic limited to two variables and\ncounting Baader
    et al. (2003), and in GNNs, from the type of message passing\nthat is accommodated,
    where direct communication involves pairs of objects but\nno triplets Grohe (2021).\n\
    \n\nThis expressive limitation, not always acknowledged, is serious. For example,\n\
    although these methods can learn general policies for guiding an agent to a\n\
